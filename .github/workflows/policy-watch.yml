name: Policy Watch

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/collect-policy-watch.mjs'
      - 'scripts/validate-policy-watch.mjs'
      - 'scripts/policy-normalization.mjs'
      - 'scripts/policy-confirmation.mjs'
      - '.github/workflows/policy-watch.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: radar-generated-data-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect official policy snapshots
        run: node scripts/collect-policy-watch.mjs

      - name: Validate policy evidence
        run: node scripts/validate-policy-watch.mjs

      - name: Rebuild factual data health from updated policy state
        run: node scripts/build-data-health.mjs

      - name: Require current trend signals in Data Health
        run: node scripts/augment-trend-health.mjs

      - name: Validate data health semantics
        run: node scripts/validate-data-health.mjs

      - name: Write policy confirmation summary
        shell: bash
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const index = JSON.parse(fs.readFileSync('public/data/policy/index.json', 'utf8'));
          const health = JSON.parse(fs.readFileSync('public/data/health/latest.json', 'utf8'));
          const changes = index.sources.flatMap((source) => source.changes ?? []);
          const confirmed = changes.filter((change) => change.confirmationStatus === 'confirmed_repeat').length;
          const legacy = changes.filter((change) => change.confirmationStatus === 'legacy_unconfirmed').length;
          const pending = index.sources.filter((source) => source.pendingCandidate).length;
          const interruptions = index.sources.reduce((sum, source) => sum + (source.candidateInterruptions?.length ?? 0), 0);
          console.log('## Policy Watch');
          console.log('');
          console.log(`Sources: **${index.freshCount}/${index.sourceCount} fresh** · fetch run: **${index.runStatus}**`);
          console.log(`Confirmed repeated changes: **${confirmed}** · pending changed hashes: **${pending}** · interrupted candidates recorded: **${interruptions}** · legacy unconfirmed records: **${legacy}**`);
          console.log(`Data Health: **${health.overall}** · essential pipelines: **${health.essentialHealthy}/${health.essentialCount} healthy**`);
          console.log('');
          console.log('A policy change is reviewable only after three consecutive successful observations of the same changed normalized content spanning at least 60 minutes. Fetch failures, different successful hashes, baseline reappearance, and normalizer upgrades break candidate continuity.');
          NODE

      - name: Commit policy evidence and health when changed
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- public/data/policy public/data/health; then
            echo 'No policy/health evidence changes to commit.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'game-opportunity-radar-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/data/policy public/data/health
          git commit -m 'data: refresh official policy snapshots and health'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Deploy refreshed policy evidence and health
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
