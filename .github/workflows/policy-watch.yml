name: Policy Watch

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/collect-policy-watch.mjs'
      - 'scripts/validate-policy-watch.mjs'
      - 'scripts/build-data-health.mjs'
      - 'scripts/validate-data-health.mjs'
      - '.github/workflows/policy-watch.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: policy-watch
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect official policy snapshots
        run: node scripts/collect-policy-watch.mjs

      - name: Validate policy evidence
        run: node scripts/validate-policy-watch.mjs

      - name: Rebuild factual data health from updated policy state
        run: node scripts/build-data-health.mjs

      - name: Validate data health semantics
        run: node scripts/validate-data-health.mjs

      - name: Commit policy evidence and health when changed
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- public/data/policy public/data/health; then
            echo 'No policy/health evidence changes to commit.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'game-opportunity-radar-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/data/policy public/data/health
          git commit -m 'data: refresh official policy snapshots and health'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Deploy refreshed policy evidence and health
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
