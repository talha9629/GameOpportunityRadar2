name: Live analyze-game smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-analysis-smoke.yml'
      - 'supabase/functions/analyze-game/**'
      - 'src/api.ts'
      - 'src/domain.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Test live iOS analysis and source provenance
        shell: bash
        run: |
          set -euo pipefail
          ENDPOINT='https://gajkwzgxfjlvdbzrvdqn.supabase.co/functions/v1/analyze-game'
          KEY='sb_publishable_nBEm6fhkwDCeFWhgpFKT3A_XDQSU6Bg'
          curl --fail-with-body --silent --show-error \
            -X POST "$ENDPOINT" \
            -H 'Content-Type: application/json' \
            -H "apikey: $KEY" \
            --data '{"input":"6761760135","mode":"analyze"}' \
            -o ios-response.json
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('ios-response.json', 'utf8'));
          if (data?.game?.storeId !== '6761760135') throw new Error(`Unexpected storeId: ${data?.game?.storeId}`);
          if (!/meowdoku/i.test(data?.game?.canonicalName ?? '')) throw new Error(`Unexpected game: ${data?.game?.canonicalName}`);
          if (!Array.isArray(data.findings) || data.findings.length < 5) throw new Error('Expected at least five evidence findings.');
          if (!Array.isArray(data.unknowns) || data.unknowns.length < 3) throw new Error('Expected explicit unknowns.');
          if (data.sourceMode !== 'automated') throw new Error(`Unexpected sourceMode: ${data.sourceMode}`);
          if (!data.rawSource || String(data.rawSource.trackId) !== '6761760135') throw new Error('Raw Apple source payload was not preserved.');
          if (typeof data.sourceObservedAt !== 'string' || Number.isNaN(Date.parse(data.sourceObservedAt))) throw new Error('Missing/invalid source observation timestamp.');
          const keys = new Set(data.findings.map((f) => f.key));
          for (const required of ['publisher', 'rating', 'rating_count', 'release_date']) {
            if (!keys.has(required)) throw new Error(`Missing finding: ${required}`);
          }
          console.log(JSON.stringify({
            game: data.game.canonicalName,
            publisher: data.game.publisher,
            findings: data.findings.length,
            unknowns: data.unknowns.length,
            rawTrackId: data.rawSource.trackId,
            sourceObservedAt: data.sourceObservedAt,
          }, null, 2));
          NODE

      - name: Test title search returns explicit candidates
        shell: bash
        run: |
          set -euo pipefail
          ENDPOINT='https://gajkwzgxfjlvdbzrvdqn.supabase.co/functions/v1/analyze-game'
          KEY='sb_publishable_nBEm6fhkwDCeFWhgpFKT3A_XDQSU6Bg'
          curl --fail-with-body --silent --show-error \
            -X POST "$ENDPOINT" \
            -H 'Content-Type: application/json' \
            -H "apikey: $KEY" \
            --data '{"input":"Meowdoku","mode":"search"}' \
            -o search-response.json
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('search-response.json', 'utf8'));
          if (!Array.isArray(data.candidates) || data.candidates.length < 1) throw new Error('Expected candidate results.');
          if (!data.candidates.some((candidate) => candidate.storeId === '6761760135')) throw new Error('Expected Meowdoku candidate was not returned.');
          console.log(`Candidate selection confirmed with ${data.candidates.length} result(s).`);
          NODE

      - name: Reject direct analysis of unresolved title text
        shell: bash
        run: |
          set -euo pipefail
          ENDPOINT='https://gajkwzgxfjlvdbzrvdqn.supabase.co/functions/v1/analyze-game'
          KEY='sb_publishable_nBEm6fhkwDCeFWhgpFKT3A_XDQSU6Bg'
          STATUS=$(curl --silent --show-error \
            -X POST "$ENDPOINT" \
            -H 'Content-Type: application/json' \
            -H "apikey: $KEY" \
            --data '{"input":"Meowdoku","mode":"analyze"}' \
            -o unresolved-response.json \
            -w '%{http_code}')
          test "$STATUS" = '409'
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('unresolved-response.json', 'utf8'));
          if (data?.error !== 'SELECTION_REQUIRED') throw new Error(`Unexpected unresolved-title error: ${data?.error}`);
          console.log('Unresolved title cannot be silently analyzed.');
          NODE

      - name: Test Android assisted-evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          ENDPOINT='https://gajkwzgxfjlvdbzrvdqn.supabase.co/functions/v1/analyze-game'
          KEY='sb_publishable_nBEm6fhkwDCeFWhgpFKT3A_XDQSU6Bg'
          STATUS=$(curl --silent --show-error \
            -X POST "$ENDPOINT" \
            -H 'Content-Type: application/json' \
            -H "apikey: $KEY" \
            --data '{"input":"com.oakever.meowdoku","mode":"analyze"}' \
            -o android-response.json \
            -w '%{http_code}')
          test "$STATUS" = '422'
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('android-response.json', 'utf8'));
          if (data?.error !== 'ANDROID_ASSISTED_REQUIRED') throw new Error(`Unexpected Android error: ${data?.error}`);
          console.log(`Android boundary confirmed: ${data.message}`);
          NODE
