name: Radar Lite weekly digest

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: write

concurrency:
  group: radar-generated-data-writer
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current canonical main after collectors
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build weekly digest from committed data
        run: node scripts/build-research-digest.mjs
      - name: Validate weekly digest
        run: node scripts/validate-weekly-digest.mjs
      - name: Commit digest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add digest/
          if ! git diff --cached --quiet; then
            git commit -m 'data: build weekly Radar Lite digest'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
