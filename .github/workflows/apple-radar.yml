name: Apple Radar

on:
  workflow_dispatch:
  schedule:
    - cron: '5 3 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/collect-apple-radar.mjs'
      - 'scripts/validate-radar-data.mjs'
      - '.github/workflows/apple-radar.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: apple-radar
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Collect Apple charts
        run: node scripts/collect-apple-radar.mjs
      - name: Validate collected Radar data
        run: npm run validate:radar
      - name: Commit snapshot safely
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/radar
          if ! git diff --cached --quiet; then
            git commit -m 'data: collect daily Apple radar snapshot'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Deploy latest main through canonical Pages workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
