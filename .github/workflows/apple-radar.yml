name: Apple Radar

on:
  workflow_dispatch:
  schedule:
    - cron: '5 3 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/collect-apple-radar.mjs'
      - '.github/workflows/apple-radar.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Collect Apple charts
        run: node scripts/collect-apple-radar.mjs
      - name: Commit snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/radar
          git diff --cached --quiet || git commit -m 'data: collect daily Apple radar snapshot'
          git push
      - name: Install dependencies
        run: npm ci
      - name: Build
        env:
          VITE_SUPABASE_URL: https://gajkwzgxfjlvdbzrvdqn.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_nBEm6fhkwDCeFWhgpFKT3A_XDQSU6Bg
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
