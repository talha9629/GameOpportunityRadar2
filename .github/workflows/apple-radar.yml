name: Apple Radar

on:
  workflow_dispatch:
  schedule:
    - cron: '5 3 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/collect-apple-radar.mjs'
      - 'scripts/validate-radar-data.mjs'
      - 'scripts/build-trend-signals.mjs'
      - 'scripts/validate-trend-signals.mjs'
      - 'scripts/build-trend-attention.mjs'
      - 'scripts/validate-trend-attention.mjs'
      - 'scripts/build-research-queue.mjs'
      - 'scripts/enrich-research-queue.mjs'
      - 'scripts/validate-research-queue.mjs'
      - 'scripts/build-verification-queue.mjs'
      - 'scripts/validate-verification-queue.mjs'
      - 'scripts/discover-gameplay-sources.mjs'
      - 'scripts/validate-gameplay-discovery.mjs'
      - 'scripts/build-research-digest.mjs'
      - 'scripts/validate-research-digest.mjs'
      - 'scripts/build-data-health.mjs'
      - 'scripts/augment-trend-health.mjs'
      - 'scripts/validate-data-health.mjs'
      - '.github/workflows/apple-radar.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: radar-generated-data-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Collect Apple charts
        run: node scripts/collect-apple-radar.mjs
      - name: Validate collected Radar data
        run: npm run validate:radar
      - name: Build exact-date trend signals
        run: node scripts/build-trend-signals.mjs
      - name: Validate exact-date trend signals
        run: node scripts/validate-trend-signals.mjs
      - name: Build cross-market Trend Attention
        run: node scripts/build-trend-attention.mjs
      - name: Validate Trend Attention provenance
        run: node scripts/validate-trend-attention.mjs
      - name: Build evidence-backed research queue
        env:
          APPBRAIN_API_KEY: ${{ secrets.APPBRAIN_API_KEY }}
          APPBRAIN_DAILY_CREDIT_CAP: '10'
        run: node scripts/build-research-queue.mjs
      - name: Attach live listing evidence packs to top candidates
        env:
          RADAR_ANALYZE_ENDPOINT: https://gajkwzgxfjlvdbzrvdqn.supabase.co/functions/v1/analyze-game
          RADAR_PUBLISHABLE_KEY: sb_publishable_nBEm6fhkwDCeFWhgpFKT3A_XDQSU6Bg
          RADAR_EVIDENCE_PACK_CAP: '8'
        run: node scripts/enrich-research-queue.mjs
      - name: Validate research queue provenance and budget
        run: node scripts/validate-research-queue.mjs
      - name: Build evidence-routed verification queue
        run: node scripts/build-verification-queue.mjs
      - name: Validate verification queue provenance and routing
        run: node scripts/validate-verification-queue.mjs
      - name: Discover suggested public gameplay sources
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: node scripts/discover-gameplay-sources.mjs
      - name: Validate gameplay discovery provenance and budget
        run: node scripts/validate-gameplay-discovery.mjs
      - name: Build exact-date research change digest
        run: node scripts/build-research-digest.mjs
      - name: Validate research digest semantics
        run: node scripts/validate-research-digest.mjs
      - name: Build factual data health report
        run: node scripts/build-data-health.mjs
      - name: Require current trend signals in Data Health
        run: node scripts/augment-trend-health.mjs
      - name: Validate data health semantics
        run: node scripts/validate-data-health.mjs
      - name: Write run summary
        shell: bash
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const t = JSON.parse(fs.readFileSync('public/data/radar/trend-signals.json', 'utf8'));
          const a = JSON.parse(fs.readFileSync('public/data/radar/trend-attention.json', 'utf8'));
          const q = JSON.parse(fs.readFileSync('public/data/research/latest.json', 'utf8'));
          const v = JSON.parse(fs.readFileSync('public/data/verification/latest.json', 'utf8'));
          const s = JSON.parse(fs.readFileSync('public/data/discovery/latest.json', 'utf8'));
          const d = JSON.parse(fs.readFileSync('public/data/research/digest.json', 'utf8'));
          const h = JSON.parse(fs.readFileSync('public/data/health/latest.json', 'utf8'));
          const suggestedSessions = s.sessions.filter((session) => session.status === 'found').length;
          const suggestedSources = s.sessions.reduce((sum, session) => sum + session.candidates.length, 0);
          const stateCounts = Object.entries(t.summary.stateCounts).map(([state, count]) => `${state} ${count}`).join(' · ');
          console.log('## Automated Research Queue');
          console.log('');
          console.log(`Data health: **${h.overall}** · essential pipelines **${h.essentialHealthy}/${h.essentialCount} healthy** · exact history **${h.facts.exactHistoryDays}/7 days**`);
          console.log(`Apple Games chart depth: **Top ${t.chartDepth}** · exact trend signals: **${t.summary.signalCount}** across **${t.summary.healthyGameMarkets}** healthy Games markets`);
          console.log(`Trend states: ${stateCounts || 'none'}`);
          console.log(`Trend Attention: **${a.summary.appCount} app(s)** · ${a.summary.evidenceCount} qualified market signal(s) · **${a.summary.crossMarketMovementCount} cross-market movement app(s)**`);
          console.log(`Radar date: **${q.radarDate}** · Apple charts: **${q.sources.appleCharts.status}** · live evidence: **${q.sources.liveAnalyzer?.status ?? 'not-run'}** · AppBrain: **${q.sources.appBrain.status}**`);
          console.log(`Verification queue: **${v.summary.taskCount}/${v.summary.rawTaskCount} explicit unknown(s) routed** · omitted ${v.summary.omittedTaskCount} · **${v.summary.captureSessionCount} capture session(s)** cover ${v.summary.groupedEvidenceTaskCount} gameplay evidence task(s) · ${v.summary.readyForHumanReview} human-review · ${v.summary.autoWaiting} auto-waiting · ${v.summary.optionalExternal} optional external`);
          console.log(`Gameplay discovery: **${s.provider.status}** · ${suggestedSessions} session(s) with suggestions · ${suggestedSources} suggested source(s) · ${s.provider.creditsUsedThisRun}/${s.provider.dailyCreditCap} Basic-search credit budget`);
          console.log(`Daily digest: **${d.status}** · ${d.summary.changeCount} exact-date change(s) · ${d.summary.attentionCount} attention item(s)`);
          console.log('');
          console.log('### Top factual trend attention');
          for (const item of a.items.slice(0, 8)) console.log(`- **${item.name}** · ${item.attentionClass.replaceAll('_', ' ')} · ${item.evidenceMarketCount} qualified market(s) · best #${item.bestRank} · ${item.reasonCodes.join(', ')}`);
          console.log('');
          console.log('| # | Title | Priority | Listing facts | Unknowns | First-party reasons |');
          console.log('|---:|---|---:|---:|---:|---|');
          for (const c of q.candidates.slice(0, 8)) console.log(`| ${c.queueRank} | ${c.name.replaceAll('|', '\\|')} | ${c.researchPriority} | ${c.analysisEvidence?.listingFindingCount ?? 0} | ${c.analysisEvidence?.unknownCount ?? '—'} | ${c.reasonCodes.join(', ')} |`);
          console.log('');
          console.log('### Next factual actions');
          for (const action of h.recommendedActions.slice(0, 5)) console.log(`- **${action.action}**${action.name ? ` · ${action.name}` : ''}: ${action.why}`);
          console.log('');
          console.log('Trend Attention groups only already-qualified exact-date rank evidence. Ordering is factual triage, not a success prediction or opportunity score. Trend visibility is a bounded chart-position heuristic, not downloads/revenue/market share. Saturation states remain reserved for separate mechanic-cluster evidence.');
          NODE
      - name: Commit snapshot, queue, verification, discovery, digest and health safely
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/radar public/data/research public/data/verification public/data/discovery public/data/health
          if ! git diff --cached --quiet; then
            git commit -m 'data: collect daily Apple radar and research queue'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Deploy latest main through canonical Pages workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
