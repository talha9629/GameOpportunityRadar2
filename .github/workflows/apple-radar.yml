name: Apple Radar

on:
  workflow_dispatch:
  schedule:
    - cron: '5 3 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/collect-apple-radar.mjs'
      - 'scripts/validate-radar-data.mjs'
      - 'scripts/trend-state.mjs'
      - 'scripts/build-trend-signals.mjs'
      - 'scripts/validate-trend-signals.mjs'
      - 'scripts/research-trend.mjs'
      - 'scripts/build-research-queue.mjs'
      - 'scripts/enrich-research-queue.mjs'
      - 'scripts/finalize-research-queue-contract.mjs'
      - 'scripts/validate-research-queue.mjs'
      - 'scripts/validate-research-queue-transport.mjs'
      - 'scripts/build-verification-queue.mjs'
      - 'scripts/validate-verification-queue.mjs'
      - 'scripts/discover-gameplay-sources.mjs'
      - 'scripts/validate-gameplay-discovery.mjs'
      - 'scripts/research-digest-facts.mjs'
      - 'scripts/build-research-digest.mjs'
      - 'scripts/validate-research-digest.mjs'
      - 'scripts/build-data-health.mjs'
      - 'scripts/google-play-health.mjs'
      - 'scripts/augment-google-play-health.mjs'
      - 'scripts/validate-google-play-health.mjs'
      - 'scripts/augment-trend-health.mjs'
      - 'scripts/validate-data-health.mjs'
      - '.github/workflows/apple-radar.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: radar-generated-data-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test trend history maturity gate
        run: node --test scripts/trend-state.node-test.mjs
      - name: Test aggregate research trend maturity gate
        run: node --test scripts/research-trend.node-test.mjs
      - name: Test digest trend-authority semantics
        run: node --test scripts/research-digest-facts.node-test.mjs
      - name: Collect Apple Games chart evidence
        run: node scripts/collect-apple-radar.mjs
      - name: Validate Radar snapshot semantics
        run: node scripts/validate-radar-data.mjs
      - name: Validate current Radar evidence quality
        run: node scripts/validate-radar-evidence-quality.mjs
      - name: Build exact-date trend signals
        run: node scripts/build-trend-signals.mjs
      - name: Validate trend-signal semantics
        run: node scripts/validate-trend-signals.mjs
      - name: Build deterministic research queue
        env:
          APPBRAIN_API_KEY: ${{ secrets.APPBRAIN_API_KEY }}
          APPBRAIN_DAILY_CREDIT_CAP: '10'
        run: node scripts/build-research-queue.mjs
      - name: Enrich research queue with live listing evidence
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/enrich-research-queue.mjs
      - name: Restore queue contract after enrichment
        run: node scripts/finalize-research-queue-contract.mjs
      - name: Validate research queue semantics
        run: node scripts/validate-research-queue.mjs
      - name: Validate research queue transport fields
        run: node scripts/validate-research-queue-transport.mjs
      - name: Build verification queue
        run: node scripts/build-verification-queue.mjs
      - name: Validate verification queue semantics
        run: node scripts/validate-verification-queue.mjs
      - name: Discover bounded public gameplay sources
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/discover-gameplay-sources.mjs
      - name: Validate gameplay discovery boundary
        run: node scripts/validate-gameplay-discovery.mjs
      - name: Build exact-date research digest
        run: node scripts/build-research-digest.mjs
      - name: Validate research digest semantics
        run: node scripts/validate-research-digest.mjs
      - name: Build factual Data Health
        run: node scripts/build-data-health.mjs
      - name: Add platform-scoped Google Play health
        run: node scripts/augment-google-play-health.mjs
      - name: Add current trend health
        run: node scripts/augment-trend-health.mjs
      - name: Validate Data Health semantics
        run: node scripts/validate-data-health.mjs
      - name: Validate Google Play health boundary
        run: node scripts/validate-google-play-health.mjs
      - name: Commit generated evidence safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/radar public/data/research public/data/verification public/data/discovery public/data/health
          if git diff --cached --quiet; then
            echo "No generated evidence changes to commit."
            exit 0
          fi
          git commit -m "data: collect daily Apple radar and research queue"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Deploy latest main through canonical Pages workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
