name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit UX literals
        run: node scripts/audit-ux-literals.mjs
      - name: Upload UX literal audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-literal-audit
          path: ux-literal-audit.json
          if-no-files-found: error
      - run: npm run validate:radar
      - name: Test policy normalization against dynamic provider chrome
        run: node --test scripts/policy-normalization.node-test.mjs
      - name: Test policy confirmation continuity
        run: node --test scripts/policy-confirmation.node-test.mjs
      - name: Validate committed policy evidence
        run: node scripts/validate-policy-watch.mjs
      - name: Test trend history maturity gate
        run: node --test scripts/trend-state.node-test.mjs
      - name: Build exact-date trend signals from committed Radar evidence
        run: node scripts/build-trend-signals.mjs
      - name: Validate trend-signal semantics
        run: node scripts/validate-trend-signals.mjs
      - name: Test aggregate research trend maturity gate
        run: node --test scripts/research-trend.node-test.mjs
      - name: Rebuild deterministic research queue contract
        env:
          APPBRAIN_DAILY_CREDIT_CAP: '0'
        run: node scripts/build-research-queue.mjs
      - name: Validate research visibility and trend semantics
        run: node scripts/validate-research-queue.mjs
      - name: Test digest trend-authority semantics
        run: node --test scripts/research-digest-facts.node-test.mjs
      - name: Rebuild exact-date research digest
        run: node scripts/build-research-digest.mjs
      - name: Validate research digest semantics
        run: node scripts/validate-research-digest.mjs
      - name: Exercise gameplay discovery without credentials
        run: node scripts/discover-gameplay-sources.mjs
      - name: Validate zero-credit discovery fallback
        run: node scripts/validate-gameplay-discovery.mjs
      - name: Test Google Play successful-observation continuity
        run: node --test scripts/google-play-history.node-test.mjs
      - name: Test Google Play platform health semantics
        run: node --test scripts/google-play-health.node-test.mjs
      - name: Exercise Google Play discovery without AppBrain credentials
        run: node scripts/collect-google-play-radar.mjs
      - name: Validate Google Play zero-provider boundary
        run: node scripts/validate-google-play-radar.mjs
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Validate installable PWA output
        shell: bash
        run: |
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          test -f dist/version.json
          test -f dist/icons/radar-192.png
          test -f dist/icons/radar-512.png
          grep -q '"buildId"' dist/version.json
          grep -q 'radar-192.png' dist/manifest.webmanifest
          grep -q 'radar-512.png' dist/manifest.webmanifest
          node <<'NODE'
          const fs = require('fs');
          for (const [file, expected] of [['dist/icons/radar-192.png', 192], ['dist/icons/radar-512.png', 512]]) {
            const png = fs.readFileSync(file);
            if (png.length < 24 || png[0] !== 0x89 || png.toString('ascii', 1, 4) !== 'PNG') throw new Error(`${file} is not a PNG`);
            const width = png.readUInt32BE(16);
            const height = png.readUInt32BE(20);
            if (width !== expected || height !== expected) throw new Error(`${file} is ${width}x${height}; expected ${expected}x${expected}`);
          }
          NODE
