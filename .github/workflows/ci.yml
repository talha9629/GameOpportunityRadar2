name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:radar
      - name: Build exact-date trend signals from committed Radar evidence
        run: node scripts/build-trend-signals.mjs
      - name: Validate trend-signal semantics
        run: node scripts/validate-trend-signals.mjs
      - name: Build cross-market Trend Attention
        run: node scripts/build-trend-attention.mjs
      - name: Validate Trend Attention provenance
        run: node scripts/validate-trend-attention.mjs
      - name: Exercise gameplay discovery without credentials
        run: node scripts/discover-gameplay-sources.mjs
      - name: Validate zero-credit discovery fallback
        run: node scripts/validate-gameplay-discovery.mjs
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
