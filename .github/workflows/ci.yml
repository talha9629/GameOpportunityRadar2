name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:radar
      - name: Exercise gameplay discovery without credentials
        run: node scripts/discover-gameplay-sources.mjs
      - name: Validate zero-credit discovery fallback
        run: node scripts/validate-gameplay-discovery.mjs
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
