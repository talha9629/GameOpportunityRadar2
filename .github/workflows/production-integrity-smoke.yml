name: Production persistence boundary

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify anonymous clients cannot read integrity report
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl --silent --output /tmp/integrity-response.json --write-out '%{http_code}' \
            --request POST \
            'https://gajkwzgxfjlvdbzrvdqn.supabase.co/rest/v1/rpc/radar_integrity_report' \
            --header 'apikey: sb_publishable_nBEm6fhkwDCeFWhgpFKT3A_XDQSU6Bg' \
            --header 'Content-Type: application/json' \
            --data '{}')
          echo "Anonymous integrity RPC status: $HTTP_CODE"
          cat /tmp/integrity-response.json
          if [ "$HTTP_CODE" != "401" ] && [ "$HTTP_CODE" != "403" ]; then
            echo "Integrity RPC must remain inaccessible to anonymous clients."
            exit 1
          fi
          echo "Production persistence boundary PASS · privileged integrity data is not public"

      - name: Verify anonymous clients cannot run Deep Verify provider
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl --silent --output /tmp/deep-verify-response.json --write-out '%{http_code}' \
            --request POST \
            'https://gajkwzgxfjlvdbzrvdqn.supabase.co/functions/v1/deep-verify-analyze' \
            --header 'apikey: sb_publishable_nBEm6fhkwDCeFWhgpFKT3A_XDQSU6Bg' \
            --header 'Content-Type: application/json' \
            --data '{"videoId":"00000000-0000-0000-0000-000000000000"}')
          echo "Anonymous Deep Verify status: $HTTP_CODE"
          cat /tmp/deep-verify-response.json

          if [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ]; then
            echo "Deep Verify provider boundary PASS · owner JWT required"
            exit 0
          fi

          if [ "$HTTP_CODE" = "503" ] && grep -q 'PROVIDER_UNCONFIGURED' /tmp/deep-verify-response.json; then
            echo "Deep Verify provider boundary PASS · provider is not configured, so no analysis can run"
            exit 0
          fi

          echo "Deep Verify provider returned an unexpected anonymous-access state."
          exit 1

      - name: Verify anonymous clients cannot register verification-session evidence
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl --silent --output /tmp/session-evidence-response.json --write-out '%{http_code}' \
            --request POST \
            'https://gajkwzgxfjlvdbzrvdqn.supabase.co/rest/v1/rpc/register_deep_verify_video_with_session' \
            --header 'apikey: sb_publishable_nBEm6fhkwDCeFWhgpFKT3A_XDQSU6Bg' \
            --header 'Content-Type: application/json' \
            --data '{"p_label":"anonymous smoke","p_store_id":"1234567890","p_source_type":"youtube_url","p_storage_path":null,"p_external_url":"https://www.youtube.com/watch?v=dQw4w9WgXcQ","p_original_name":null,"p_mime_type":null,"p_size_bytes":null,"p_duration_seconds":null,"p_verification_session_id":"aaaaaaaaaaaaaaaaaaaaaaaa","p_verification_task_ids":["bbbbbbbbbbbbbbbbbbbbbbbb"],"p_verification_unknowns":["This is a deliberately unresolved verification smoke-test claim."],"p_verification_categories":["gameplay_mechanic"],"p_verification_research_generated_at":"2026-09-26T00:00:00Z"}')
          echo "Anonymous verification-session RPC status: $HTTP_CODE"
          cat /tmp/session-evidence-response.json
          if [[ "$HTTP_CODE" =~ ^2 ]]; then
            echo "Verification-session evidence registration must remain inaccessible to anonymous clients."
            exit 1
          fi
          echo "Verification-session persistence boundary PASS · anonymous write denied"
